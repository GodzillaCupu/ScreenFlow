name: scriptflow
description: "ScriptFlow — The Focused Muse. Local-first AI scripting & teleprompter studio for content creators."
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.6 ships with Flutter 3.27 — required for Color.withValues / WidgetState.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation + state
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1

  # Local-first storage (replaces Firestore/Firebase)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  path: ^1.9.0

  # AI engine (client-side Gemini)
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1

  # Audio recording (device microphone) + export/share
  record: ^5.2.0
  share_plus: ^10.1.4

  # UI / typography
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Isar codegen
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  # flutter_dotenv requires the env file to be bundled as an asset.
  assets:
    - .env
